name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  frontend:
    name: Console (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular 22 needs Node 22.22+ or 24.15+.
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build
      # Vitest on jsdom - no browser needed on the runner.
      - run: npm test -- --watch=false
