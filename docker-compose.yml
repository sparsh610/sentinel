# Sentinel local stack.
#
#   docker compose up -d                  Postgres + pgvector only (weeks 1-2)
#   docker compose --profile stream up -d  adds Kafka (week 3)
#   docker compose --profile llm up -d     adds Ollama for local models (week 1+)
#   docker compose --profile auth up -d    adds Keycloak (week 7)
#
# Profiles keep the default start-up light. Only Postgres is needed to begin.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: sentinel-kafka
    profiles: ["stream"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    profiles: ["llm"]
    ports:
      # Published on 11435, not 11434, on purpose. A natively installed Ollama binds
      # 127.0.0.1:11434 and the container gets the IPv6 wildcard, so `localhost` reaches a
      # different server depending on which client resolves it first - curl finds the
      # container, the JVM finds the native install and 404s on models it does not have.
      # A distinct port removes the ambiguity instead of documenting it.
      - "11435:11434"
    volumes:
      - sentinel-ollama:/root/.ollama
    # After first start, pull the models:
    #   docker exec sentinel-ollama ollama pull nomic-embed-text
    #   docker exec sentinel-ollama ollama pull llama3.1:8b

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sentinel-keycloak
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./db/keycloak:/opt/keycloak/data/import:ro

volumes:
  sentinel-pgdata:
  sentinel-ollama:
