# Publishes the investigation tools as an MCP server, so Claude Code or Codex CLI can use them.
#
#   mvn -pl copilot-service spring-boot:run -Dspring-boot.run.profiles=mcp
#   export SENTINEL_TOKEN=$(scripts/sentinel-token.sh alex.analyst alex)
#   claude mcp add --transport http sentinel http://localhost:8081/mcp --header "Authorization: Bearer $SENTINEL_TOKEN"
#   codex mcp add sentinel --url http://localhost:8081/mcp --bearer-token-env-var SENTINEL_TOKEN
#
# ---------------------------------------------------------------------------------------
# The client on the other end is a hosted model, so what the tools return goes to that
# model's provider. Three controls stand between the two (week 7, design decisions §6, §8, §16):
#
#  * Authentication. /mcp needs a Keycloak token like every other endpoint, and the client acts
#    as that person: their role checks, their document clearance.
#  * Masking. Counterparty names, IBANs, card numbers and e-mail addresses leave as stable
#    tokens (PARTY-3f9a1c2e); an investigation goes out with its masked note and without the
#    tools' raw output.
#  * Audit. Every call is an audit_event in the token's name - OK, DENIED or FAILED.
#
# Customer ids are not masked: they are the bank's pseudonymous keys and the tools need them.
# Still demo data only - a real deployment would need the provider under contract (a DPA, zero
# retention, in-region processing) before any of this left the bank.
#
# What it cannot do, by design: no tool approves, escalates, closes or reports a case. The MCP
# client can read evidence and ask Sentinel's own agent for a draft; people decide, in the
# console (docs/design-decisions.md §8).
# ---------------------------------------------------------------------------------------

spring:
  ai:
    mcp:
      server:
        enabled: true
        name: sentinel
        version: 0.6.0
        # Streamable HTTP, at /mcp - what both Claude Code and Codex CLI speak.
        protocol: STREAMABLE
        instructions: >
          Sentinel is a transaction-monitoring system for anti-money-laundering. Start with
          listOpenAlerts; use riskScore, customerHistory, peerSegment and policyLookup to gather
          evidence about one alert, and cite policy clauses by number. draftCaseNote asks
          Sentinel's own agent for a draft. Decisions are made by people in the Sentinel console;
          no tool here can make one.
