# Keeps the context smoke test from needing a live Postgres or Kafka. The repositories are
# supplied as mocks by the test itself.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  kafka:
    admin:
      auto-create: false
    listener:
      # The listener containers would otherwise start polling a broker that is not there.
      auto-startup: false

sentinel:
  scoring:
    topic: transactions
    dead-letter-topic: transactions-dlt
    topic-partitions: 3
    cash-threshold: 10000
    structuring:
      band-floor: 9000
      min-count: 3
      window: 24h
    high-risk-countries: [KP, IR, MM]
    models:
      # Nowhere: the context must start without exported models, as it does in CI.
      dir: target/no-models
      classifier-threshold: 0.98
      anomaly-score: 0.40
