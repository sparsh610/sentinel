# Keeps the context smoke test from needing a live Postgres or Kafka. The repositories are
# supplied as mocks by the test itself.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/sentinel
          audiences: sentinel-api
          authorities-claim-name: roles
          authority-prefix: ROLE_
          principal-claim-name: preferred_username
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  kafka:
    admin:
      # Otherwise KafkaAdmin tries to reach a broker at start-up to create the topic.
      auto-create: false

sentinel:
  ingest:
    topic: transactions
    topic-partitions: 3
    outbox:
      relay-enabled: false
      poll-interval-ms: 500
      batch-size: 100
