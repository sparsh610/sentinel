spring:
  application:
    name: tx-ingest
  datasource:
    url: ${{SENTINEL_DB_URL:jdbc:postgresql://localhost:5432/sentinel}}
    username: ${{SENTINEL_DB_USER:sentinel}}
    password: ${{SENTINEL_DB_PASSWORD:sentinel}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
